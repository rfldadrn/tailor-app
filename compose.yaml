services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kasapp
      POSTGRES_USER: kasapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - kasapp-postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kasapp -d kasapp"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.docker}
      AUTH_TRUST_HOST: "true"
      DATABASE_URL: postgresql://kasapp:${POSTGRES_PASSWORD}@db:5432/kasapp?schema=public
      NODE_ENV: production
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  kasapp-postgres-data:
